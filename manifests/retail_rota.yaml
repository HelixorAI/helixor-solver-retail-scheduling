domain: RetailRostering
problem_type: retail_rota
policy_id: rostering
version: "1.0"
description: "Skills-aware scheduling for a small retailer"

ui:
  hidden: false
  surfaces:
    solve:
      enabled: true
      primary: true
      label: "Build a retail rota"
      description: "Load employees and shifts, solve, and inspect coverage."

decision:
  entities: {source: employees, identity: id}
  groups: {source: shifts, identity: id}
  domain: {total_over_entities: false, total_over_groups: true}

problem_inputs:
  planning_horizon_days:
    name: "Planning horizon"
    description: "Number of days covered by this schedule."
    category: dimensions
    type: number
    required: true
    default: 7
    min: 1
    max: 28
    step: 1
    unit: days

  default_required_staff:
    name: "Default employees per shift"
    description: "Used only when constructing new shift records in the UX."
    category: coverage
    type: number
    required: true
    default: 1
    min: 1
    max: 20
    step: 1

data_schema:
  entities:
    employees:
      description: "Employees who can be assigned to shifts."
      required: true
      columns:
        - name: id
          type: string
          required: true
          description: "Unique employee identifier."
        - name: skills
          type: array<string>
          required: true
          description: "Skills this employee holds."
        - name: max_hours
          type: number
          required: false
          unit: hours
          description: "Maximum hours in the planning period. The maximum-hours control applies when this is absent."
        - name: acceptable_shift_ids
          type: array<string>
          required: false
          description: "Shift ids this employee prefers."
    shifts:
      description: "Shifts that need coverage."
      required: true
      columns:
        - name: id
          type: string
          required: true
          description: "Unique shift identifier."
        - name: day
          type: integer
          required: true
          description: "Day index, starting at 0."
        - name: duration_hours
          type: number
          required: true
          unit: hours
          description: "Paid length of the shift."
        - name: required_skill
          type: string
          required: true
          description: "Skill an assigned employee must hold."
        - name: required_staff
          type: integer
          required: true
          description: "Number of employees the shift needs."

constraints:
  skill_match:
    name: "Required skill"
    description: "An employee must hold the shift's required skill."
    type: eligibility
    default_enabled: true
    contract: assigned_in_entity_set
    parameters:
      group_attribute: required_skill
      entity_attribute: skills

  one_shift_per_day:
    name: "One shift per employee per day"
    description: "An employee cannot cover two shifts on the same day."
    type: eligibility
    default_enabled: true
    contract: entity_exclusive
    parameters: {key_attribute: day, limit: 1}

  min_coverage:
    name: "Minimum coverage"
    description: "Every shift must meet its own staffing requirement."
    type: hard
    default_enabled: true
    contract: aggregate
    parameters:
      collect: count
      compare: ">="
      group_attribute: required_staff

  max_hours:
    name: "Maximum hours"
    description: "Do not exceed each employee's period limit."
    type: hard
    default_enabled: true
    contract: entity_load_max
    parameters:
      day_attribute: day
      load_attribute: duration_hours
      limit_attribute: max_hours

  shift_preference:
    name: "Shift preference"
    description: "Prefer shifts the employee has marked acceptable."
    type: soft
    weight: 10.0
    default_enabled: true
    contract: assigned_in_entity_set
    parameters:
      group_attribute: id
      entity_attribute: acceptable_shift_ids
